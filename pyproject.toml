[project]
name = "keyfleet"
version = "0.2.1"
description = "Local-first ledger for hardware security keys: which key is registered where, and what breaks if one is lost."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "PrimeLayer" }]
keywords = ["security-keys", "fido2", "u2f", "passkeys", "yubikey", "2fa", "inventory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/ThePrimeLayer/keyfleet"
Issues = "https://github.com/ThePrimeLayer/keyfleet/issues"
Changelog = "https://github.com/ThePrimeLayer/keyfleet/blob/main/CHANGELOG.md"

[project.scripts]
keyfleet = "keyfleet.cli:app"

[dependency-groups]
# ruff is pinned exactly and must match the rev in .pre-commit-config.yaml
# (AGENTS.md §8.5); bump both only in a dedicated `chore(deps):` commit.
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff==0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keyfleet"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
