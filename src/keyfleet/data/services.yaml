# Bundled service data: where each service's security-key settings live, how
# many keys it allows, and whether it supports FIDO2 discoverable credentials
# (passkeys).
#
# Rules for contributions (AGENTS.md §6):
# - Entries are alphabetical by id and every entry carries `source_url` (the
#   vendor's OWN page stating the facts) and `verified: YYYY-MM-DD`.
# - A fact not stated on the vendor's page is `null` — never a guess.
#   `max_keys: null` is the common case; most services document no limit.
# - `fido2_discoverable: false` means the vendor's page shows no passkey
#   support (see notes); `null` means the page doesn't say either way.
# - Regenerate docs/SERVICES.md after editing:
#   uv run python scripts/gen_services_md.py

services:
  1password:
    name: "1Password"
    security_settings_url: null
    max_keys: null
    fido2_discoverable: true
    notes: "FIDO U2F keys as a second factor; unlocking with a passkey exists in beta."
    source_url: https://support.1password.com/security-key/
    verified: 2026-08-29
